<!doctype html>
<html lang="id" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#0a0d12" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>NeX-Agent Web</title>
    <script>
      // Tetapkan tema sebelum CSS dimuat agar tidak berkedip (FOUC).
      (function () {
        try {
          var saved = localStorage.getItem("nex.theme");
          if (saved !== "light" && saved !== "dark") {
            saved =
              window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches
                ? "light"
                : "dark";
          }
          document.documentElement.dataset.theme = saved;
        } catch (e) {
          document.documentElement.dataset.theme = "dark";
        }
      })();
    </script>
    <link rel="stylesheet" href="/assets/vendor/xterm.css" />
    <link rel="stylesheet" href="/assets/styles.css" />
  </head>
  <body>
    <div id="app">
      <aside id="sidebar" aria-label="Daftar sesi">
        <header class="sidebar-head">
          <div class="brand"><span class="dot"></span><span>NeX-Agent</span></div>
          <button id="new-session" class="icon-btn" title="Sesi baru" aria-label="Sesi baru">+</button>
        </header>
        <div id="sessions" class="sessions"></div>
        <footer id="conn" class="conn">menyambung…</footer>
      </aside>

      <div id="backdrop" class="backdrop"></div>

      <main>
        <nav class="tabs">
          <button
            id="sidebar-toggle"
            class="icon-btn hamburger"
            title="Menu sesi"
            aria-label="Buka menu sesi"
            aria-expanded="false"
          >
            <svg
              width="18"
              height="18"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              aria-hidden="true"
            >
              <path d="M3 6h18M3 12h18M3 18h18" />
            </svg>
          </button>

          <div class="tabgroup" role="tablist" aria-label="Tampilan">
            <button class="tab active" data-tab="chat" role="tab" aria-selected="true">Chat</button>
            <button class="tab" data-tab="terminal" role="tab" aria-selected="false">Terminal</button>
          </div>

          <span class="spacer"></span>
          <span id="status" class="status" title="Status agen"
            ><span class="sdot"></span><span class="stext">siap</span></span
          >
          <button
            id="theme-toggle"
            class="icon-btn"
            type="button"
            title="Ganti tema terang/gelap"
            aria-label="Ganti tema terang/gelap"
            aria-pressed="false"
          >
            <svg
              class="i-sun"
              width="18"
              height="18"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <circle cx="12" cy="12" r="4" />
              <path
                d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"
              />
            </svg>
            <svg
              class="i-moon"
              width="18"
              height="18"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" />
            </svg>
          </button>
          <span id="mode-badge" class="badge" role="button" tabindex="0" title="Klik untuk ganti mode"
            >build</span
          >
          <label
            class="toggle"
            title="Setujui otomatis semua permintaan izin (tulis/edit/perintah) untuk sesi ini"
          >
            <input type="checkbox" id="allow-all" />
            <span class="switch" aria-hidden="true"></span>
            <span class="toggle-text">auto-izin</span>
          </label>
        </nav>

        <section id="view-chat" class="view">
          <div id="messages" class="messages" role="log" aria-live="polite" aria-label="Percakapan"></div>
          <div class="composer">
            <textarea
              id="input"
              rows="1"
              aria-label="Tulis pesan"
              autocomplete="off"
              placeholder="Minta NeX-Agent"
            ></textarea>
            <button id="send" class="primary">Kirim</button>
            <button id="stop" class="danger" hidden>Stop</button>
          </div>
        </section>

        <section id="view-terminal" class="view" hidden>
          <div id="terminal"></div>
        </section>
      </main>
    </div>

    <script src="/assets/vendor/xterm.js"></script>
    <script src="/assets/vendor/addon-fit.js"></script>
    <script src="/assets/app.js"></script>
  </body>
</html>
